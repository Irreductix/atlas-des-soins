name: Atlas

# Reconstruit les données et publie le site : à chaque modification, et le 3 de chaque mois
# après la publication mensuelle des fichiers FINESS convertis.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 3 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tests
        run: npm test
      - name: Fichiers FINESS du mois
        run: |
          mkdir -p sources/finess
          curl -sSfL -o sources/finess.zip https://github.com/Irreductix/referentiels-sante/releases/download/donnees-du-mois/finess.zip
          unzip -q -o sources/finess.zip etablissements.csv activites.csv structures-resume.json -d sources/finess
      - name: Base de la HAS
        run: curl -sSfL -o sources/valeurs.csv https://minio.data.has-sante.fr/bqss/prod/valeurs.csv
      - name: Données de l'atlas
        run: node scripts/construire.mjs --finess sources/finess --has sources/valeurs.csv --sortie site/donnees
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
